openapi: 3.0.3
info:
  title: tls-api
  version: 1.0.0
  description: REST API OpenAPI documentation for the tls-api
paths:
  /workspace/tls/certificates:
    get:
      operationId: list_certificates
      description: List all certificates owned by your account.
      summary: List certificates
      parameters:
      - in: query
        name: certificate_type
        schema:
          type: string
          pattern: ^.*$
        description: Filter by certificate type (accepts comma-separated values).
      - $ref: '#/components/parameters/FieldsParam'
      - in: query
        name: id
        schema:
          type: integer
          format: int64
        description: Filter by certificate ID (accepts comma-separated values).
      - in: query
        name: issuer
        schema:
          type: string
          pattern: ^.*$
        description: Filter by issuer (case-insensitive, partial match).
      - in: query
        name: last_modified
        schema:
          type: string
          format: date-time
          pattern: ^.*$
        description: Filter by exact last modified date and time.
      - in: query
        name: last_modified__gte
        schema:
          type: string
          format: date-time
          pattern: ^.*$
        description: Filter by last modified date (greater than or equal).
      - in: query
        name: last_modified__lte
        schema:
          type: string
          format: date-time
          pattern: ^.*$
        description: Filter by last modified date (less than or equal).
      - in: query
        name: managed
        schema:
          type: boolean
        description: Filter by managed status.
      - in: query
        name: name
        schema:
          type: string
          pattern: ^.*$
        description: Filter by certificate name (case-insensitive, partial match).
      - in: query
        name: ordering
        schema:
          type: string
          pattern: ^.*$
        description: 'Which field to use when ordering the results. (Valid fields:
          id, name, certificate_type, managed, issuer, last_modified, renewed_at)'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      - in: query
        name: renewed_at
        schema:
          type: string
          format: date-time
          pattern: ^.*$
        description: Filter by exact renewed date and time.
      - in: query
        name: renewed_at__gte
        schema:
          type: string
          format: date-time
          pattern: ^.*$
        description: Filter by renewed date (greater than or equal).
      - in: query
        name: renewed_at__lte
        schema:
          type: string
          format: date-time
          pattern: ^.*$
        description: Filter by renewed date (less than or equal).
      - in: query
        name: search
        schema:
          type: string
          pattern: ^.*$
        description: 'A search term to filter results. Searches across the following
          fields: name, issuer.'
      tags:
      - Digital Certificates - Certificates
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCertificateList'
          description: List of certificates retrieved successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: create_certificate
      description: Create a new certificate for your account.
      summary: Create a certificate
      tags:
      - Digital Certificates - Certificates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Certificate'
        required: true
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateResponse'
          description: Certificate created successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspace/tls/certificates/{certificate_id}:
    get:
      operationId: retrieve_certificate
      description: Retrieve details from a specific certificate in your account.
      summary: Retrieve details from a certificate
      parameters:
      - in: path
        name: certificate_id
        schema:
          type: integer
          format: int64
        description: The unique identifier of the certificate
        required: true
      - $ref: '#/components/parameters/FieldsParam'
      tags:
      - Digital Certificates - Certificates
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateResponse'
          description: Certificate details retrieved successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: update_certificate
      description: Update an existing certificate. This replaces the entire certificate
        with the new data provided.
      summary: Update a certificate
      parameters:
      - in: path
        name: certificate_id
        schema:
          type: integer
          format: int64
        description: The unique identifier of the certificate
        required: true
      tags:
      - Digital Certificates - Certificates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Certificate'
        required: true
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateResponse'
          description: Ok
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: partial_update_certificate
      description: Update one or more fields of an existing certificate without affecting
        other fields.
      summary: Partially update a certificate
      parameters:
      - in: path
        name: certificate_id
        schema:
          type: integer
          format: int64
        description: The unique identifier of the certificate
        required: true
      tags:
      - Digital Certificates - Certificates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCertificate'
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateResponse'
          description: Ok
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: delete_certificate
      description: Delete a specific certificate in your account.
      summary: Delete a certificate
      parameters:
      - in: path
        name: certificate_id
        schema:
          type: integer
          format: int64
        description: The unique identifier of the certificate
        required: true
      tags:
      - Digital Certificates - Certificates
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
          description: Certificate deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspace/tls/certificates/request:
    post:
      operationId: request_certificate
      description: Request a new certificate for your account.
      summary: Request a certificate
      tags:
      - Digital Certificates - Request a Certificate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateRequest'
        required: true
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateResponse'
          description: Certificate request submitted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspace/tls/crls:
    get:
      operationId: list_certificate_revocation_lists
      description: List all certificate revocation lists (CRL) owned by your account.
      summary: List certificate revocation lists (CRL)
      parameters:
      - $ref: '#/components/parameters/FieldsParam'
      - in: query
        name: id
        schema:
          type: integer
          format: int64
        description: Filter by CRL ID (accepts comma-separated values).
      - in: query
        name: issuer
        schema:
          type: string
          pattern: ^.*$
        description: Filter by issuer (case-insensitive, partial match).
      - in: query
        name: last_modified
        schema:
          type: string
          format: date-time
          pattern: ^.*$
        description: Filter by exact last modified date and time.
      - in: query
        name: last_modified__gte
        schema:
          type: string
          format: date-time
          pattern: ^.*$
        description: Filter by last modified date (greater than or equal).
      - in: query
        name: last_modified__lte
        schema:
          type: string
          format: date-time
          pattern: ^.*$
        description: Filter by last modified date (less than or equal).
      - in: query
        name: last_update
        schema:
          type: string
          format: date-time
          pattern: ^.*$
        description: Filter by exact last update date and time.
      - in: query
        name: last_update__gte
        schema:
          type: string
          format: date-time
          pattern: ^.*$
        description: Filter by last update date (greater than or equal).
      - in: query
        name: last_update__lte
        schema:
          type: string
          format: date-time
          pattern: ^.*$
        description: Filter by last update date (less than or equal).
      - in: query
        name: name
        schema:
          type: string
          pattern: ^.*$
        description: Filter by CRL name (case-insensitive, partial match).
      - in: query
        name: next_update
        schema:
          type: string
          format: date-time
          pattern: ^.*$
        description: Filter by exact next update date and time.
      - in: query
        name: next_update__gte
        schema:
          type: string
          format: date-time
          pattern: ^.*$
        description: Filter by next update date (greater than or equal).
      - in: query
        name: next_update__lte
        schema:
          type: string
          format: date-time
          pattern: ^.*$
        description: Filter by next update date (less than or equal).
      - in: query
        name: ordering
        schema:
          type: string
          pattern: ^.*$
        description: 'Which field to use when ordering the results. (Valid fields:
          id, name, issuer, last_update, next_update, last_modified)'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      - in: query
        name: search
        schema:
          type: string
          pattern: ^.*$
        description: 'A search term to filter results. Searches across the following
          fields: name, issuer.'
      tags:
      - Digital Certificates - Certificate Revocation Lists
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCertificateRevocationList'
          description: List of certificate revocation lists retrieved successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: create_certificate_revocation_list
      description: Create a new certificate revocation lists (CRL) for your account.
      summary: Create a certificate revocation lists (CRL)
      tags:
      - Digital Certificates - Certificate Revocation Lists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateRevocationList'
        required: true
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateRevocationListResponse'
          description: Certificate revocation list created successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspace/tls/crls/{crl_id}:
    get:
      operationId: retrieve_certificate_revocation_list
      description: Retrieve details from a specific certificate revocation lists (CRL)
        in your account.
      summary: Retrieve details from a certificate revocation lists (CRL)
      parameters:
      - in: path
        name: crl_id
        schema:
          type: integer
          format: int64
        description: The unique identifier of the certificate revocation list
        required: true
      - $ref: '#/components/parameters/FieldsParam'
      tags:
      - Digital Certificates - Certificate Revocation Lists
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateRevocationListResponse'
          description: Certificate revocation list details retrieved successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: update_certificate_revocation_list
      description: Update an existing certificate revocation lists (CRL).  This replaces
        the entire certificate with the new data provided.
      summary: Update a certificate revocation lists (CRL)
      parameters:
      - in: path
        name: crl_id
        schema:
          type: integer
          format: int64
        description: The unique identifier of the certificate revocation list
        required: true
      tags:
      - Digital Certificates - Certificate Revocation Lists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateRevocationList'
        required: true
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateRevocationListResponse'
          description: Certificate revocation list updated successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: partial_update_certificate_revocation_list
      description: Update one or more fields of an existing certificate revocation
        lists (CRL) without affecting other fields.
      summary: Partially update a certificate revocation lists (CRL)
      parameters:
      - in: path
        name: crl_id
        schema:
          type: integer
          format: int64
        description: The unique identifier of the certificate revocation list
        required: true
      tags:
      - Digital Certificates - Certificate Revocation Lists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCertificateRevocationList'
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateRevocationListResponse'
          description: Certificate revocation list partially updated successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: delete_certificate_revocation_list
      description: Delete a specific certificate revocation list in your account.
      summary: Delete a certificate revocation list
      parameters:
      - in: path
        name: crl_id
        schema:
          type: integer
          format: int64
        description: The unique identifier of the certificate revocation list
        required: true
      tags:
      - Digital Certificates - Certificate Revocation Lists
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
          description: Certificate revocation list deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspace/tls/csr:
    post:
      operationId: create_certificate_signing_request
      description: Create a new certificate signing request (CSR) for your account.
      summary: Create a certificate signing request (CSR)
      tags:
      - Digital Certificates - Certificate Signing Requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateSigningRequest'
        required: true
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateResponse'
          description: Certificate signing request created successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    Certificate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          format: int64
        name:
          type: string
          pattern: .*
          maxLength: 250
          minLength: 1
        certificate:
          type: string
          nullable: true
          pattern: .*
          maxLength: 1000000
          minLength: 1
        private_key:
          type: string
          writeOnly: true
          nullable: true
          pattern: .*
          maxLength: 64000
          minLength: 1
        issuer:
          type: string
          readOnly: true
          nullable: true
          pattern: .*
        subject_name:
          type: array
          items:
            type: string
            pattern: ^.*$
          readOnly: true
        validity:
          type: string
          readOnly: true
          nullable: true
          pattern: ^.*$
        type:
          type: string
          default: edge_certificate
          description: |-
            The value can't be changed after the certificate creation.

            * `edge_certificate` - Certificate
            * `trusted_ca_certificate` - Trusted CA Certificate
          enum:
          - edge_certificate
          - trusted_ca_certificate
          x-extensible-enum:
          - edge_certificate
          - trusted_ca_certificate
        managed:
          type: boolean
          readOnly: true
          default: false
        status:
          type: string
          description: |-
            * `pending` - Pending
            * `challenge_verification` - Challenge Verification
            * `active` - Active
            * `inactive` - Inactive
            * `expired` - Expired
            * `failed` - Failed
          readOnly: true
          enum:
          - pending
          - challenge_verification
          - active
          - inactive
          - expired
          - failed
          x-extensible-enum:
          - pending
          - challenge_verification
          - active
          - inactive
          - expired
          - failed
        status_detail:
          type: string
          readOnly: true
          default: ''
          pattern: .*
          maxLength: 500
          minLength: 0
        csr:
          type: string
          readOnly: true
          nullable: true
          pattern: .*
        challenge:
          type: string
          description: |-
            * `dns` - Uses DNS to solve the ACME challenge.
            * `http` - Uses HTTP to solve the ACME challenge.
          readOnly: true
          enum:
          - dns
          - http
          x-extensible-enum:
          - dns
          - http
        authority:
          type: string
          description: '* `lets_encrypt` - lets_encrypt'
          readOnly: true
          enum:
          - lets_encrypt
          x-extensible-enum:
          - lets_encrypt
        key_algorithm:
          type: string
          readOnly: true
          pattern: .*
        active:
          type: boolean
        product_version:
          type: string
          readOnly: true
          pattern: \d+\.\d+
          maxLength: 50
          minLength: 3
        last_editor:
          type: string
          readOnly: true
          pattern: ^.*$
        created_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Timestamp of the certificate creation on the platform.
          pattern: ^.*$
        last_modified:
          type: string
          format: date-time
