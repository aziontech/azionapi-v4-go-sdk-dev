components:
  schemas:
    AWS4HMAC:
      type: object
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/AWS4HMACTypeEnum'
          default: aws4_hmac_sha256
        attributes:
          $ref: '#/components/schemas/AWS4HMACAttributes'
      required:
      - attributes
      title: AWS4HMAC
      additionalProperties: false
    AWS4HMACAttributes:
      type: object
      properties:
        region:
          type: string
          pattern: .*
          maxLength: 255
          minLength: 1
        service:
          type: string
          default: s3
          pattern: .*
          maxLength: 255
          minLength: 1
        access_key:
          type: string
          pattern: .*
          maxLength: 255
          minLength: 1
        secret_key:
          type: string
          pattern: .*
          maxLength: 255
          minLength: 1
      required:
      - access_key
      - region
      - secret_key
      title: AWS4HMACAttributes
      additionalProperties: false
    AWS4HMACAttributesRequest:
      type: object
      properties:
        region:
          type: string
          minLength: 1
          pattern: .*
          maxLength: 255
        service:
          type: string
          minLength: 1
          default: s3
          pattern: .*
          maxLength: 255
        access_key:
          type: string
          minLength: 1
          pattern: .*
          maxLength: 255
        secret_key:
          type: string
          minLength: 1
          pattern: .*
          maxLength: 255
      required:
      - access_key
      - region
      - secret_key
      title: AWS4HMACAttributesRequest
      additionalProperties: false
    AWS4HMACRequest:
      type: object
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/AWS4HMACTypeEnum'
          default: aws4_hmac_sha256
        attributes:
          $ref: '#/components/schemas/AWS4HMACAttributesRequest'
      required:
      - attributes
      title: AWS4HMACRequest
      additionalProperties: false
    AWS4HMACTypeEnum:
      enum:
      - aws4_hmac_sha256
      type: string
      description: '* `aws4_hmac_sha256` - AWS for HMAC - SHA256'
      title: AWS4HMACTypeEnum
      x-extensible-enum:
      - aws4_hmac_sha256
    Address:
      type: object
      properties:
        active:
          type: boolean
          default: true
          description: Indicates if the address is active for use
        address:
          type: string
          description: IPv4/IPv6 address or CNAME to resolve
          pattern: .*
          maxLength: 255
          minLength: 1
        http_port:
          type: integer
          maximum: 65535
          minimum: 1
          default: 80
          description: Port number for HTTP connections
          format: int64
        https_port:
          type: integer
          maximum: 65535
          minimum: 1
          default: 443
          description: Port number for HTTPS connections
          format: int64
        modules:
          allOf:
          - $ref: '#/components/schemas/AddressModules'
          nullable: true
          type: object
      required:
      - address
      title: Address
      additionalProperties: false
    AddressLoadBalancerModule:
      type: object
      properties:
        server_role:
          allOf:
          - $ref: '#/components/schemas/ServerRoleEnum'
          default: primary
          description: |-
            Role of the address in load balancing

            * `primary` - Primary
            * `backup` - Backup
        weight:
          type: integer
          maximum: 100
          minimum: 1
          default: 1
          description: Weight used in load balancing strategy
          format: int64
      title: AddressLoadBalancerModule
      additionalProperties: false
    AddressLoadBalancerModuleRequest:
      type: object
      properties:
        server_role:
          allOf:
          - $ref: '#/components/schemas/ServerRoleEnum'
          default: primary
          description: |-
            Role of the address in load balancing

            * `primary` - Primary
            * `backup` - Backup
        weight:
          type: integer
          maximum: 100
          minimum: 1
          default: 1
          description: Weight used in load balancing strategy
          format: int64
      title: AddressLoadBalancerModuleRequest
      additionalProperties: false
    AddressModules:
      type: object
      properties:
        load_balancer:
          $ref: '#/components/schemas/AddressLoadBalancerModule'
      title: AddressModules
      additionalProperties: false
    AddressModulesRequest:
      type: object
      properties:
        load_balancer:
          $ref: '#/components/schemas/AddressLoadBalancerModuleRequest'
      title: AddressModulesRequest
      additionalProperties: false
    AddressRequest:
      type: object
      properties:
        active:
          type: boolean
          default: true
          description: Indicates if the address is active for use
        address:
          type: string
          minLength: 1
          description: IPv4/IPv6 address or CNAME to resolve
          pattern: .*
          maxLength: 255
        http_port:
          type: integer
          maximum: 65535
          minimum: 1
          default: 80
          description: Port number for HTTP connections
          format: int64
        https_port:
          type: integer
          maximum: 65535
          minimum: 1
          default: 443
          description: Port number for HTTPS connections
          format: int64
        modules:
          allOf:
          - $ref: '#/components/schemas/AddressModulesRequest'
          nullable: true
          type: object
      required:
      - address
      title: AddressRequest
      additionalProperties: false
    Application:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          format: int64
        name:
          type: string
          pattern: .*
          maxLength: 100
          minLength: 1
        last_editor:
          type: string
          readOnly: true
          pattern: .*
          maxLength: 250
          minLength: 1
        last_modified:
          type: string
          format: date-time
          readOnly: true
        modules:
          $ref: '#/components/schemas/ApplicationModules'
        active:
          type: boolean
          default: true
        debug:
          type: boolean
          default: false
        product_version:
          type: string
          readOnly: true
        version_id:
          type: string
          nullable: true
          readOnly: true
          description: ID of the version metadata (use in /versions/{id} URLs)
        version_state:
          type: string
          nullable: true
          readOnly: true
          description: Build state of this version (queued, building, ready, error,
            ...)
        is_versioned:
          type: boolean
          default: false
          readOnly: true
        version:
          type: integer
          nullable: true
          readOnly: true
          format: int64
      required:
      - name
      title: Application
      additionalProperties: false
    ApplicationAcceleratorModule:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
      title: ApplicationAcceleratorModule
      additionalProperties: false
    ApplicationAcceleratorModuleRequest:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
