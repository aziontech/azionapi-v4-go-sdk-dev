    NetworkList:
      type: object
      description: |-
        A Network List item can be one of the following formats:


        1. IP Addresses (IPv4/IPv6):

            - Simple IPv4: 192.168.0.1

            - IPv4 with CIDR: 192.168.0.1/24

            - Simple IPv6: 2001:db8:3333:4444:5555:6666:7777:8888

            - IPv6 with CIDR: 2001:db8::/32

            - IP with expiration date: 192.168.0.1 --LT2025-05-29T12:25:23Z

                (The expiration date format is --LT followed by ISO8601 date in UTC timezone)


        2. Country Codes:

            - Two-character uppercase alphanumeric country code (ISO 3166-1 alpha-2)

            - Examples: BR, US, DE, JP


        3. Autonomous System Numbers (ASN):

            - Number composed of digits only

            - Examples: 1234, 5678, 13335
      properties:
        id:
          type: integer
          readOnly: true
          format: int64
        name:
          type: string
          pattern: .*
          maxLength: 250
          minLength: 1
        type:
          $ref: '#/components/schemas/NetworkListTypeEnum'
        items:
          type: array
          items:
            type: string
            pattern: .*
            maxLength: 250
            minLength: 0
          maxItems: 20000
          minItems: 1
        last_editor:
          type: string
          readOnly: true
          pattern: .*
          maxLength: 250
        last_modified:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        active:
          type: boolean
          default: true
        version_id:
          type: string
          nullable: true
          readOnly: true
          description: ID of the version metadata (use in /versions/{id} URLs)
        version_state:
          type: string
          nullable: true
          readOnly: true
          description: Build state of this version (queued, building, ready, error,
            ...)
        is_versioned:
          type: boolean
          default: false
          readOnly: true
        version:
          type: integer
          nullable: true
          readOnly: true
          format: int64
      required:
      - items
      - name
      - type
      title: NetworkList
      additionalProperties: false
