openapi: 3.0.3
info:
  title: storage-api
  version: 1.0.0
  description: REST API OpenAPI documentation for the Storage
  license:
    name: MIT
    url: https://github.com/aziontech/azionapi-v4-openapi/blob/main/LICENSE
paths:
  /workspace/storage/buckets:
    get:
      operationId: list_buckets
      description: List all buckets.
      summary: List buckets
      parameters:
      - in: query
        name: bucket
        schema:
          type: string
          pattern: ^.*$
        description: Filter by bucket (exact match).
      - in: query
        name: created
        schema:
          type: string
          format: date-time
          pattern: ^.*$
        description: Filter by creation date (exact match).
      - in: query
        name: created__gte
        schema:
          type: string
          format: date-time
          pattern: ^.*$
        description: Filter by creation date (greater than or equal).
      - in: query
        name: created__lte
        schema:
          type: string
          format: date-time
          pattern: ^.*$
        description: Filter by creation date (less than or equal).
      - in: query
        name: description
        schema:
          type: string
          pattern: ^.*$
        description: Filter by description (case-insensitive, partial match).
      - $ref: '#/components/parameters/FieldsParam'
      - in: query
        name: last_editor
        schema:
          type: string
          pattern: ^.*$
        description: Filter by last editor (case-insensitive, partial match).
      - in: query
        name: last_modified
        schema:
          type: string
          format: date-time
          pattern: ^.*$
        description: Filter by last modified date (exact match).
      - in: query
        name: last_modified__gte
        schema:
          type: string
          format: date-time
          pattern: ^.*$
        description: Filter by last modified date (greater than or equal).
      - in: query
        name: last_modified__lte
        schema:
          type: string
          format: date-time
          pattern: ^.*$
        description: Filter by last modified date (less than or equal).
      - in: query
        name: name
        schema:
          type: string
          pattern: ^.*$
        description: Filter by name (case-insensitive, partial match).
      - $ref: '#/components/parameters/OrderingParam'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      - $ref: '#/components/parameters/SearchParam'
      - in: query
        name: status
        schema:
          type: string
          pattern: ^.*$
        description: Filter by status (accepts comma-separated values).
      - in: query
        name: workloads_access
        schema:
          type: string
          pattern: ^.*$
        description: Filter by workloads access (accepts comma-separated values).
      tags:
      - Storage - Buckets
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBucketList'
          description: List of buckets retrieved successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: create_bucket
      description: Create a new bucket.
      summary: Create a new bucket
      tags:
      - Storage - Buckets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BucketCreateRequest'
        required: true
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketCreateResponse'
          description: Bucket created successfully.
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketCreateResponse'
          description: Bucket creation request accepted and is being processed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspace/storage/buckets/{bucket_name}:
    get:
      operationId: retrieve_bucket
      description: Retrieve details from a specific bucket.
      summary: Retrieve a bucket
      parameters:
      - in: path
        name: bucket_name
        schema:
          type: string
          pattern: ^.*$
        description: The name of the bucket
        required: true
      - $ref: '#/components/parameters/FieldsParam'
      tags:
      - Storage - Buckets
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketCreateResponse'
          description: Bucket details retrieved successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: update_bucket
      description: Update bucket information (bucket name cannot be changed)
      summary: Update bucket info
      parameters:
      - in: path
        name: bucket_name
        schema:
          type: string
          pattern: ^.*$
        description: The name of the bucket
        required: true
      tags:
      - Storage - Buckets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBucketRequest'
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketCreateResponse'
          description: Bucket updated successfully.
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketCreateResponse'
          description: Bucket update request accepted and is being processed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: delete_bucket
      description: Delete a specific bucket.
      summary: Delete a bucket
      parameters:
      - in: path
        name: bucket_name
        schema:
          type: string
          pattern: ^.*$
        description: The name of the bucket
        required: true
      tags:
      - Storage - Buckets
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
          description: Bucket deleted successfully.
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
          description: Bucket deletion request accepted and is being processed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspace/storage/buckets/{bucket_name}/objects:
    get:
      operationId: list_objects
      description: List objects from bucket
      summary: List objects from bucket
      parameters:
      - in: query
        name: all_levels
        schema:
          type: boolean
          default: true
        description: 'If true, lists objects recursively. If false, lists only the
          first level using Delimiter=''/'' (default: true).'
      - in: path
        name: bucket_name
        schema:
          type: string
          pattern: ^.*$
        description: The name of the bucket
        required: true
      - in: query
        name: continuation_token
        schema:
          type: string
          pattern: ^.*$
        description: A continuation token for the next page of records.
      - $ref: '#/components/parameters/FieldsParam'
      - in: query
        name: max_object_count
        schema:
          type: integer
          format: int64
        description: Number of results to be returned on the page. Limited to 1000
          objects.
      - in: query
        name: prefix
        schema:
          type: string
          default: ''
          pattern: ^.*$
        description: 'Filter objects by key prefix. If empty, lists from the bucket
          root (default: empty).'
      tags:
      - Storage - Objects
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseBucketObject'
          description: List of bucket objects retrieved successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspace/storage/buckets/{bucket_name}/objects/{object_key}:
    get:
      operationId: download_object
      description: Download the object key from bucket.
      summary: Download object
      parameters:
      - in: path
        name: bucket_name
        schema:
          type: string
          pattern: ^.*$
        description: The name of the bucket
        required: true
      - $ref: '#/components/parameters/FieldsParam'
      - in: path
        name: object_key
        schema:
          type: string
          pattern: ^.*$
        description: The key/path of the object within the bucket
        required: true
      tags:
      - Storage - Objects
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                pattern: ^.*$
          description: Object downloaded successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: create_object_key
      description: Create a new object key in the bucket. The object's Content-Type
        is defined by the Content-Type header. If this header is not included, the
        Content-Type will be automatically detected.
      summary: Create new object key.
      parameters:
      - in: header
        name: Storage-Content-Type
        schema:
          type: string
          pattern: ^.*$
        description: The MIME type of the object being uploaded (Renamed from Content-Type
          to avoid SDK conflicts)
      - in: path
        name: bucket_name
        schema:
          type: string
          pattern: ^.*$
        description: The name of the bucket
        required: true
      - in: path
        name: object_key
        schema:
          type: string
          pattern: ^.*$
        description: The key/path of the object within the bucket
        required: true
      tags:
      - Storage - Objects
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              pattern: ^.*$
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessObjectOperation'
          description: Object created successfully.
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessObjectOperationAsync'
          description: Object creation request accepted and is being processed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: update_object_key
      description: Update the object key from bucket. The object's Content-Type is
        defined by the Content-Type header. If this header is not included, the Content-Type
        will be automatically detected.
      summary: Update the object key.
      parameters:
      - in: header
        name: Storage-Content-Type
        schema:
          type: string
          pattern: ^.*$
        description: The MIME type of the object being uploaded (Renamed from Content-Type
          to avoid SDK conflicts)
      - in: path
        name: bucket_name
        schema:
          type: string
          pattern: ^.*$
        description: The name of the bucket
        required: true
      - in: path
        name: object_key
        schema:
          type: string
          pattern: ^.*$
        description: The key/path of the object within the bucket
        required: true
      tags:
      - Storage - Objects
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              pattern: ^.*$
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessObjectOperation'
          description: Object updated successfully.
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessObjectOperationAsync'
          description: Object update request accepted and is being processed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: delete_object_key
      description: Upon a successful deletion request, the object will be permanently
        deleted after a 24-hour grace period.
      summary: Delete object key
      parameters:
      - in: path
        name: bucket_name
        schema:
          type: string
          pattern: ^.*$
        description: The name of the bucket
        required: true
      - in: path
        name: object_key
        schema:
          type: string
          pattern: ^.*$
        description: The key/path of the object within the bucket
        required: true
      tags:
      - Storage - Objects
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
          description: Object deleted successfully.
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
          description: Object deletion request accepted and is being processed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspace/storage/buckets/{bucket_name}/objects/{object_key}/copy/{new_object_key}:
    post:
      operationId: copy_object_key
      description: Copy an object to a new key within the same bucket.
      summary: Copy object to new key
      parameters:
      - in: path
        name: bucket_name
        schema:
          type: string
          pattern: ^.*$
        description: The name of the bucket
        required: true
      - in: path
        name: new_object_key
        schema:
          type: string
          pattern: ^.*$
        description: The key/path of the destination object within the bucket
        required: true
      - in: path
        name: object_key
        schema:
          type: string
          pattern: ^.*$
        description: The key/path of the source object within the bucket
        required: true
      tags:
      - Storage - Objects
      requestBody:
        content:
          application/json:
            schema: {}
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                description: Object copied successfully
          description: ''
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspace/storage/credentials:
    get:
      operationId: list_credentials
      description: List all credentials.
      summary: List credentials
      parameters:
      - in: query
        name: access_key
        schema:
          type: string
          pattern: ^.*$
        description: Filter by access key (exact match).
      - in: query
        name: buckets
        schema:
          type: string
          pattern: ^.*$
        description: Filter by bucket name (exact match).
      - in: query
        name: buckets__in
        schema:
          type: string
          pattern: ^.*$
        description: Filter by multiple bucket names (comma-separated).
      - $ref: '#/components/parameters/FieldsParam'
      - in: query
        name: id
        schema:
          type: integer
          format: int64
        description: Filter by id (accepts comma-separated values).
      - in: query
        name: last_editor
        schema:
          type: string
          pattern: ^.*$
        description: Filter by last editor (case-insensitive, partial match).
      - in: query
        name: last_modified
        schema:
          type: string
          format: date-time
          pattern: ^.*$
        description: Filter by last modified date (exact match).
      - in: query
        name: last_modified__gte
        schema:
          type: string
          format: date-time
          pattern: ^.*$
        description: Filter by last modified date (greater than or equal).
      - in: query
        name: last_modified__lte
        schema:
          type: string
          format: date-time
          pattern: ^.*$
        description: Filter by last modified date (less than or equal).
      - in: query
        name: name
        schema:
          type: string
          pattern: ^.*$
        description: Filter by name (case-insensitive, partial match).
      - $ref: '#/components/parameters/OrderingParam'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      - $ref: '#/components/parameters/SearchParam'
      tags:
      - Storage - Credentials
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCredentialList'
          description: List of credentials retrieved successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: create_credential
      description: Create a new credential.
      summary: Create a new credential
      tags:
      - Storage - Credentials
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCreateRequest'
        required: true
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialResponse'
          description: Credential created successfully.
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialResponse'
          description: Credential creation request accepted and is being processed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspace/storage/credentials/{credential_id}:
    get:
      operationId: retrieve_credential
      description: Retrieve details from a specific credential.
      summary: Retrieve details from a credential
      parameters:
      - in: path
        name: credential_id
        schema:
          type: integer
          format: int64
        description: The unique identifier of the credential
        required: true
      - $ref: '#/components/parameters/FieldsParam'
      tags:
      - Storage - Credentials
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialResponse'
          description: Credential details retrieved successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: delete_credential
      description: Delete a specific credential.
      summary: Delete a credential
      parameters:
      - in: path
        name: credential_id
        schema:
          type: integer
          format: int64
        description: The unique identifier of the credential
        required: true
      tags:
      - Storage - Credentials
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
          description: Credential deleted successfully.
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
          description: Credential deletion request accepted and is being processed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    Bucket:
      type: object
      properties:
