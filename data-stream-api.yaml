components:
  schemas:
    AWSKinesisFirehoseEndpoint:
      type: object
      properties:
        access_key:
          type: string
          maxLength: 150
          minLength: 1
          pattern: ^.*$
        stream_name:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^.*$
        region:
          type: string
          maxLength: 50
          minLength: 1
          pattern: ^.*$
        secret_key:
          type: string
          maxLength: 150
          minLength: 1
          pattern: ^.*$
        type:
          type: string
          enum:
          - aws_kinesis_firehose
          description: Discriminator field for Output
          x-extensible-enum:
          - aws_kinesis_firehose
          pattern: ^.*$
      required:
      - access_key
      - region
      - secret_key
      - stream_name
      - type
      title: AWSKinesisFirehoseEndpoint
      additionalProperties: false
    AWSKinesisFirehoseEndpointRequest:
