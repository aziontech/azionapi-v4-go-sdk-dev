openapi: 3.0.3
info:
  title: data-stream-api
  version: 1.0.0
  description: REST API OpenAPI documentation for the Data Stream
paths:
  /workspace/stream/data_sources:
    get:
      operationId: list_data_sources
      description: List all Data Sources.
      summary: List of Data Sources
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
        description: Filter by active status.
      - $ref: '#/components/parameters/FieldsParam'
      - in: query
        name: name
        schema:
          type: string
        description: Filter by name (case-insensitive, partial match).
      - name: ordering
        required: false
        in: query
        description: |-
          Which field to use when ordering the results.
          (Valid fields: slug, name, active)
        schema:
          type: string
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      - in: query
        name: search
        schema:
          type: string
        description: 'A search term to filter results. Searches across the following
          fields: name, slug.'
      - in: query
        name: slug
        schema:
          type: string
        description: Filter by slug (case-insensitive, exact match).
      tags:
      - Data Stream - Data Sources
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDataSourceList'
          description: Ok
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workspace/stream/streams:
    get:
      operationId: list_data_streams
      description: List all Data Streams owned by your account.
      summary: List Data Streams
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
        description: Filter by active status.
      - in: query
        name: created__gte
        schema:
          type: string
          format: date-time
        description: Filter by created date (greater than or equal).
      - in: query
        name: created__lte
        schema:
          type: string
          format: date-time
        description: Filter by created date (less than or equal).
      - in: query
        name: data_set_id
        schema:
          type: integer
          format: int64
        description: Filter by data set id (accepts comma-separated values).
      - in: query
        name: data_source
        schema:
          type: string
        description: Filter by data source (accepts comma-separated values).
      - $ref: '#/components/parameters/FieldsParam'
      - in: query
        name: id
        schema:
          type: integer
          format: int64
        description: Filter by id (accepts comma-separated values).
      - in: query
        name: last_editor
        schema:
          type: string
        description: Filter by last editor (case-insensitive, partial match).
      - in: query
        name: last_modified__gte
        schema:
          type: string
          format: date-time
        description: Filter by last modified date (greater than or equal).
      - in: query
        name: last_modified__lte
        schema:
          type: string
          format: date-time
        description: Filter by last modified date (less than or equal).
      - in: query
        name: name
        schema:
          type: string
        description: Filter by name (case-insensitive, partial match).
      - name: ordering
        required: false
        in: query
        description: |-
          Which field to use when ordering the results.
          (Valid fields: id, name, data_source, data_set_id, active, last_editor, last_modified)
        schema:
          type: string
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      - in: query
        name: search
        schema:
          type: string
        description: 'A search term to filter results. Searches across the following
          fields: name.'
      tags:
      - Data Stream - Streams
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDataStreamList'
          description: Ok
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: create_data_stream
      description: Create a new Data Stream in your account.
      summary: Create a Data Stream
      tags:
      - Data Stream - Streams
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataStreamRequest'
        required: true
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataStreamResponse'
          description: Created
        '400':
          $ref: '#/components/responses/BadRequest'
