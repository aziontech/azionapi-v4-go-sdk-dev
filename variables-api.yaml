openapi: 3.0.3
info:
  title: Azion Variables API
  version: 1.0.0
  description: REST API OpenAPI documentation for the Azion Variables
paths:
  /scope-groups/{group_slug}/scopes:
    post:
      operationId: create_scope
      description: Create a new Client Scope.
      summary: Create a Scope
      parameters:
      - in: path
        name: group_slug
        schema:
          type: string
        description: The slug of the Scope Group.
        required: true
        examples:
          ExampleFor"Global"ScopeGroup:
            value: global
            summary: Example for "Global" Scope Group
          ExampleFor"MyScope"ScopeGroup:
            value: my-group
            summary: Example for "My Scope" Scope Group
      tags:
      - Variables - Scope Groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScopeRequest'
            examples:
              SimpleScopeCreationForGlobalScopeGroup:
                value:
                  slug: my-new-scope
                  name: My new Scope
                summary: Simple Scope creation for Global Scope Group
        required: true
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scope'
          description: ''
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scope-groups/{group_slug}/scopes/{scope_slug}/variables:
    get:
      operationId: list_scope_variables
      description: List all Variables from a given Scope.
      summary: List Scope Variables
      parameters:
      - in: query
        name: client_id
        schema:
          type: string
        description: ID from Client to get the variables
        required: true
      - in: path
        name: group_slug
        schema:
          type: string
        description: The slug of the Scope Group.
        required: true
        examples:
          ExampleFor"Global"ScopeGroup:
            value: global
            summary: Example for "Global" Scope Group
          ExampleFor"MyScope"ScopeGroup:
            value: my-group
            summary: Example for "My Scope" Scope Group
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      - in: path
        name: scope_slug
        schema:
          type: string
        description: The slug of the Scope.
        required: true
        examples:
          ExampleFor"Global"Scope:
            value: global
            summary: Example for "Global" Scope
          ExampleFor"MyScope"Scope:
            value: my-scope
            summary: Example for "My Scope" Scope
      tags:
      - Variables - Scope Groups
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVariableGetList'
          description: ''
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: create_scope_variables
      description: Create Variables for a given scope.
      summary: Create Scope Variables
      parameters:
      - in: path
        name: group_slug
        schema:
          type: string
        description: The slug of the Scope Group.
        required: true
        examples:
          ExampleFor"Global"ScopeGroup:
            value: global
            summary: Example for "Global" Scope Group
          ExampleFor"MyScope"ScopeGroup:
            value: my-group
            summary: Example for "My Scope" Scope Group
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      - in: path
        name: scope_slug
        schema:
          type: string
        description: The slug of the Scope.
        required: true
        examples:
          ExampleFor"Global"Scope:
            value: global
            summary: Example for "Global" Scope
          ExampleFor"MyScope"Scope:
            value: my-scope
            summary: Example for "My Scope" Scope
      tags:
      - Variables - Scope Groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariableCreateRequest'
            examples:
              SimpleScopeVariablesCreation:
                value:
                - key: EXAMPLE_SCOPE_VAR_01
                  value: My not secret value 01
                - key: EXAMPLE_SCOPE_VAR_02
                  value: My not secret value 02
                summary: Simple Scope variables creation
              ScopeSecretVariablesCreation:
                value:
                - key: EXAMPLE_SCOPE_SECRET_VAR_01
                  value: My secret value 01
                  secret: true
                - key: EXAMPLE_SCOPE_SECRET_VAR_02
                  value: My secret value 02
                  secret: true
                summary: Scope Secret Variables creation
        required: true
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVariableGetList'
          description: ''
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: update_scope_variables
      description: Update Variables for a given scope.
      summary: Update Scope Variables
      parameters:
      - in: path
        name: group_slug
        schema:
          type: string
        description: The slug of the Scope Group.
        required: true
        examples:
          ExampleFor"Global"ScopeGroup:
            value: global
            summary: Example for "Global" Scope Group
          ExampleFor"MyScope"ScopeGroup:
            value: my-group
            summary: Example for "My Scope" Scope Group
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      - in: path
        name: scope_slug
        schema:
          type: string
        description: The slug of the Scope.
        required: true
        examples:
          ExampleFor"Global"Scope:
            value: global
            summary: Example for "Global" Scope
          ExampleFor"MyScope"Scope:
            value: my-scope
            summary: Example for "My Scope" Scope
      tags:
      - Variables - Scope Groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedVariableBatchUpdateRequest'
            examples:
              SimpleScopeVariablesUpdate:
                value:
                - uuid: 7dd67cea-5c80-42ec-9b3f-0bfc3b50f33e
                  key: EXAMPLE_SCOPE_VAR_01
                  value: My not secret value 01
                - uuid: 7ec43b60-30c8-48a7-ad82-6785f53deeff
                  key: EXAMPLE_SCOPE_VAR_02
                  value: My not secret value 02
                summary: Simple Scope variables update
              ScopeSecretVariablesUpdate:
                value:
                - uuid: 7dd67cea-5c80-42ec-9b3f-0bfc3b50f33e
                  key: EXAMPLE_SCOPE_SECRET_VAR_01
                  value: My secret value 01
                  secret: true
                - uuid: 7ec43b60-30c8-48a7-ad82-6785f53deeff
                  key: EXAMPLE_SCOPE_SECRET_VAR_02
                  value: My secret value 02
                  secret: true
                summary: Scope Secret Variables update
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVariableGetList'
          description: ''
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /variables:
    get:
      operationId: list_variables
      description: List all Variables of the Client.
      summary: List Variables
      parameters:
      - in: query
        name: created_at__gte
        schema:
          type: string
          format: date-time
        description: Filter by creation date (greater than or equal).
      - in: query
        name: created_at__lte
        schema:
          type: string
          format: date-time
        description: Filter by creation date (less than or equal).
      - $ref: '#/components/parameters/FieldsParam'
      - in: query
        name: key
        schema:
          type: string
        description: Filter by key (case-insensitive, partial match).
      - in: query
        name: last_editor
        schema:
          type: string
        description: Filter by last editor (case-insensitive, partial match).
      - name: ordering
        required: false
        in: query
        description: |-
          Which field to use when ordering the results.
          (Valid fields: key, created_at, updated_at, last_editor)
        schema:
          type: string
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      - in: query
        name: resource_id
        schema:
          type: string
        description: Filter by scope resource id (the external id of the resource_type).
          Accepts comma-separated values, unless `resource_type` also holds several
          values.
      - in: query
        name: resource_type
        schema:
          type: string
        description: Filter by scope resource type (global, environment, deployment,
          application, firewall). Accepts comma-separated values. Combined with `resource_id`,
          both must match the same scope, and only one of the two may hold several
          values. Use `scope` to ask for several type and id pairs.
      - in: query
        name: scope
        schema:
          type: string
        description: Filter by scope. Comma-separated selectors, each `global` or
          `<resource_type>:<resource_id>` (e.g. `global,environment:AJQ6CZJE`). Returns
          variables bound to any selector. Up to 50 selectors. Sending `scope` without
          any selector is rejected.
      - in: query
        name: scope_id
        schema:
          type: string
        description: Deprecated alias for `resource_id`.
        deprecated: true
      - in: query
        name: scope_type
        schema:
          type: string
        description: Deprecated alias for `resource_type`.
        deprecated: true
      - $ref: '#/components/parameters/SearchParam'
      - in: query
        name: secret
        schema:
          type: boolean
        description: Filter by secret status (true for secret variables, false for
          non-secret variables).
      - in: query
        name: updated_at__gte
        schema:
          type: string
          format: date-time
        description: Filter by updated date (greater than or equal).
      - in: query
        name: updated_at__lte
        schema:
          type: string
          format: date-time
        description: Filter by updated date (less than or equal).
      - in: query
        name: uuid
        schema:
          type: string
        description: Filter by uuid (accepts comma-separated values).
      tags:
      - Variables
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVariableGetList'
          description: ''
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: create_variable
      description: Create a new Variable. <br><ul><li>If the attribute "secret" is
        informed with value "true" in request payload the Variable value will be secret
        and no longer viewable after creation.</li><li>If the attribute "secret" is
        not informed the Variable value will be considered as not secret by default.</li></ul>
      summary: Create a Variable
      tags:
      - Variables
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariableCreateRequest'
            examples:
              SimpleVariableCreation:
                value:
                  key: EXAMPLE_SIMPLE_VAR
                  value: My not secret value
                summary: Simple Variable creation
              SecretVariableCreation:
                value:
                  key: EXAMPLE_SECRET_VAR
                  value: My secret value
                  secret: true
                summary: Secret Variable creation
        required: true
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariableGet'
          description: ''
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /variables/{uuid}:
    get:
      operationId: retrieve_variable
      description: Retrieve all data for a Variable by it's UUID
      summary: Retrieve details of a Variable
      parameters:
      - $ref: '#/components/parameters/FieldsParam'
      - in: path
        name: uuid
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        required: true
        description: A unique value identifying the variable.
      tags:
      - Variables
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariableGet'
          description: ''
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: update_variable
      description: Update variable attributes by it's UUID. Keep the Variable UUID
        but overwrite all editable attributes.
      summary: Update a Variable
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        required: true
        description: A unique value identifying the variable.
      tags:
      - Variables
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariableCreateRequest'
            examples:
              SimpleVariableUpdate:
                value:
                  key: EXAMPLE_NEW_SIMPLE_VAR_KEY
                  value: My new not secret value
                summary: Simple Variable update
              SecretVariableUpdate:
                value:
                  key: EXAMPLE_NEW_SECRET_VAR_KEY
                  value: My new secret value
                  secret: true
                summary: Secret Variable update
        required: true
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariableGet'
          description: ''
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: partial_update_variable
      description: Partially update variable attributes by it's UUID. Only the sent
        fields are changed.
      summary: Partially update a Variable
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        required: true
        description: A unique value identifying the variable.
      tags:
      - Variables
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedVariableCreateRequest'
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariableGet'
          description: ''
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: delete_variable
      description: Delete a Variable by it's UUID
      summary: Delete a Variable
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        required: true
        description: A unique value identifying the variable.
      tags:
      - Variables
      security:
      - TokenAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: No response body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    PaginatedVariableGetList:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
          maximum: 2147483647
          example: 123
          description: Total number of items
          format: int64
        total_pages:
          type: integer
          minimum: 1
          maximum: 2147483647
          example: 10
          description: Total number of pages
          format: int64
        page:
          type: integer
          minimum: 1
          maximum: 2147483647
          example: 1
          description: Current page number
          format: int64
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          example: 10
          description: Number of items per page
          format: int64
        next:
          type: string
          nullable: true
          format: uri
          example: https://api.example.com/items?page=3
          description: URL to the next page of results
        previous:
          type: string
          nullable: true
          format: uri
          example: https://api.example.com/items?page=1
          description: URL to the previous page of results
        results:
          type: array
          items:
            $ref: '#/components/schemas/VariableGet'
      title: PaginatedVariableGetList
      additionalProperties: false
    PatchedVariableBatchUpdateRequest:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        key:
          type: string
          minLength: 1
          maxLength: 100
        value:
          type: string
        secret:
          type: boolean
          nullable: true
      title: PatchedVariableBatchUpdateRequest
      additionalProperties: false
    PatchedVariableCreateRequest:
      type: object
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 100
        value:
          type: string
        secret:
          type: boolean
          nullable: true
      title: PatchedVariableCreateRequest
      additionalProperties: false
    Scope:
      type: object
      properties:
        slug:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 100
        created_at:
          type: string
          format: date-time
      required:
      - name
      - slug
      title: Scope
      additionalProperties: false
    ScopeRequest:
      type: object
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          minLength: 1
          maxLength: 100
        created_at:
          type: string
          format: date-time
      required:
      - name
      - slug
      title: ScopeRequest
      additionalProperties: false
    VariableCreateRequest:
      type: object
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 100
        value:
          type: string
        secret:
          type: boolean
          nullable: true
      required:
      - key
      title: VariableCreateRequest
      additionalProperties: false
    VariableGet:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        key:
          type: string
          nullable: true
          maxLength: 100
        value:
          type: string
          nullable: true
          readOnly: true
        secret:
          type: boolean
          readOnly: true
          nullable: true
        last_editor:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - created_at
      - updated_at
      title: VariableGet
      additionalProperties: false
    JSONAPIErrorObject:
      type: object
      description: Serializer for a single JSON:API error object.
      properties:
        status:
          type: string
          description: The HTTP status code applicable to this problem
          pattern: ^\d{3}$
          maxLength: 3
          minLength: 3
        code:
          type: string
          description: An application-specific error code
          pattern: ^\d{5}$
          maxLength: 5
          minLength: 5
        title:
          type: string
          description: A short, human-readable summary of the problem
          pattern: ^.*$
          maxLength: 4096
          minLength: 1
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of
            the problem
          pattern: ^.*$
          maxLength: 4096
          minLength: 1
        source:
          allOf:
          - $ref: '#/components/schemas/JSONAPIErrorSource'
          description: References to the primary source of the error
        meta:
          type: object
          additionalProperties: {}
          description: Non-standard meta-information about the error
      additionalProperties: false
    JSONAPIErrorSource:
      type: object
      description: Serializer for the 'source' object in a JSON:API error.
      properties:
        pointer:
          type: string
          description: JSON Pointer to the value in the request document that caused
            the error
          pattern: ^(/[^/]+)+$
          maxLength: 4096
          minLength: 1
        parameter:
          type: string
          description: URI query parameter that caused the error
          pattern: ^.*$
          maxLength: 4096
          minLength: 1
        header:
          type: string
          description: Request header name that caused the error
          pattern: ^.*$
          maxLength: 4096
          minLength: 1
      additionalProperties: false
    ErrorResponse:
      type: object
      description: Serializer for a JSON:API error response.
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/JSONAPIErrorObject'
          description: Array of error objects
      required:
      - errors
      additionalProperties: false
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
  responses:
    Unauthorized:
      description: Authentication Failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Error-10001:
              value:
                errors:
                - status: '401'
                  code: '10001'
                  title: Authentication Failed
                  detail: Invalid authentication credentials.
              summary: Authentication Failed
              description: Invalid authentication credentials.
    Forbidden:
      description: Permission Denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Error-10003:
              value:
                errors:
                - status: '403'
                  code: '10003'
                  title: Permission Denied
                  detail: You do not have permission to perform this action.
              summary: Permission Denied
              description: You do not have permission to perform this action.
    TooManyRequests:
      description: Throttled
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Error-10010:
              value:
                errors:
                - status: '429'
                  code: '10010'
                  title: Throttled
                  detail: Request was throttled.
              summary: Throttled
              description: Request was throttled.
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Error-10067:
              value:
                errors:
                - status: '500'
                  code: '10067'
                  title: Internal Server Error
                  detail: A server error occurred.
              summary: Internal Server Error
              description: A server error occurred.
  parameters:
    PageParam:
      name: page
      required: false
      in: query
      description: A page number within the paginated result set.
      schema:
        type: integer
        format: int64
    PageSizeParam:
      name: page_size
      required: false
      in: query
      description: A numeric value that indicates the number of items per page.
      schema:
        type: integer
        format: int64
    SearchParam:
      name: search
      required: false
      in: query
      description: A search term.
      schema:
        type: string
    FieldsParam:
      name: fields
      required: false
      in: query
      description: Comma-separated list of field names to include in the response.
      schema:
        type: string
tags:
- name: Variables
  description: Manage a client's variables.
- name: Variable Versions
